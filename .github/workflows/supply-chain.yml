name: supply-chain

on:
  push:
    branches: [ main ]

permissions:
  id-token: write      # Für keyless signing via GitHub OIDC
  contents: read
  packages: write      # Für GHCR Push

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io

    steps:
      # -------------------------
      # Phase 0: Setup
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/supply-chain-app" >> $GITHUB_ENV

      - name: Install Task
        run: |
          sudo snap install task --classic
          task --version

      - name: Build tools container image
        run: |
          docker build -t supply-chain-tools -f tools/Dockerfile .

      # -------------------------
      # Phase 1: Security Scans
      # -------------------------
      - name: Run all security scans
        run: |
          task scan-all

      # -------------------------
      # Phase 2: Attestation Generation
      # -------------------------
      - name: Set up Docker Buildx (attestation support)
        run: |
          docker buildx create --name container-builder --driver docker-container --use || true
          docker buildx inspect --bootstrap

      - name: Build image with attestation artifacts (provenance, sbom)
        run: |
          task build-image-with-attestation

      - name: Extract provenance and SBOM predicates
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mkdir -p attestations
          cat out/provenance.json | jq .predicate | tee attestations/provenance.json
          jq '.predicate' out/sbom.spdx.json > attestations/sbom.json

      - name: Validate provenance attestation
        run: task validate:provenance

      - name: Validate SBOM attestation
        run: task validate:sbom

      - name: Build application image (locally)
        run: task build-image

      - name: Generate vulnerability attestations
        run: |
          mkdir -p attestations
          task exec -- trivy fs --format cosign-vuln src/ > attestations/vuln-source.json
          task exec -- trivy config --format cosign-vuln src/iac/ > attestations/vuln-iac.json
          task exec -- trivy image --format cosign-vuln supply-chain-app:latest > attestations/vuln-image.json

      - name: List all generated attestations
        run: ls -lh attestations/

      - name: Validate all attestations
        run: task validate:all-attestations

      # -------------------------
      # Phase 3: Sign, Attest, Verify (ttl.sh)
      # -------------------------

      - name: Build local image for ttl.sh
        run: |
          task build-image
          docker tag supply-chain-app:latest ttl.sh/supply-chain-app-${HOSTNAME}:3h

      - name: Push image to ttl.sh and capture digest
        run: |
          docker push ttl.sh/supply-chain-app-${HOSTNAME}:3h 2>&1 | tee push-output.txt
          export DIGEST=$(grep "digest:" push-output.txt | awk '{print $3}')
          echo "DIGEST=${DIGEST}" >> $GITHUB_ENV
          echo "IMAGE=ttl.sh/supply-chain-app-${HOSTNAME}@${DIGEST}" >> $GITHUB_ENV

      - name: Show image reference
        run: |
          echo "Image: $IMAGE"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          task exec -- cosign sign --yes $IMAGE

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          task exec -- cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            $IMAGE | jq

      - name: Attach provenance attestation
        run: |
          task exec -- cosign attest --yes \
            --type slsaprovenance \
            --predicate attestations/provenance.json \
            $IMAGE

      - name: Verify provenance attestation
        run: |
          task exec -- cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            $IMAGE | jq

      - name: Attach SBOM attestation
        run: |
          task exec -- cosign attest --yes \
            --type spdxjson \
            --predicate attestations/sbom.json \
            $IMAGE

      - name: Attach vulnerability attestations
        run: |
          task exec -- cosign attest --yes --type vuln --predicate attestations/vuln-source.json $IMAGE
          task exec -- cosign attest --yes --type vuln --predicate attestations/vuln-iac.json $IMAGE
          task exec -- cosign attest --yes --type vuln --predicate attestations/vuln-image.json $IMAGE

      - name: Check Rekor entries
        run: |
          HASH=$(echo $DIGEST | cut -d: -f2)
          task exec -- rekor-cli search --sha $HASH | tee rekor.txt
          COUNT=$(cat rekor.txt | grep -E '^[0-9a-f]{64}$' | wc -l)
          echo "Found $COUNT Rekor entries"
          if [ "$COUNT" -lt 6 ]; then
            echo "❌ Not enough Rekor entries"
            exit 1
          fi
          echo "✅ Rekor entries OK"
