name: security-scan

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Task
        run: |
          sudo snap install task --classic 2>&1
          task --version

      - name: Build tools container image
        run: |
          docker build -t supply-chain-tools -f tools/Dockerfile .

      - name: Run all security scans
        run: |
          task scan-all

