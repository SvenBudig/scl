name: supply-chain

on:
  push:
    branches: [ main ]

permissions:
  id-token: write      # GitHub OIDC für Cosign
  contents: read
  packages: write      # Für ghcr.io Push

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/supply-chain-app
      TAG: ${{ github.sha }}

    steps:
      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Task
      - name: Install Taskfile runner
        run: |
          sudo snap install task --classic
          task --version

      # 3. Build tools image (für lokale Scans)
      - name: Build tools container
        run: docker build -t supply-chain-tools -f tools/Dockerfile .

      # 4. Run all security scans (must fail on HIGH/CRITICAL)
      - name: Run all security scans
        run: task scan-all

      # 5. Generate Attestations: SBOM + Provenance (via BuildKit)
      - name: Build and push image to GHCR with SBOM + Provenance
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          sbom: true
          provenance: true

      # 6. Capture digest and construct full IMAGE reference
      - name: Capture image digest
        run: |
          echo "DIGEST=${{ steps.build-image.outputs.digest }}" >> $GITHUB_ENV
          echo "IMAGE=${{ env.IMAGE_NAME }}@${{ steps.build-image.outputs.digest }}" >> $GITHUB_ENV

      # 7. Build again for local Trivy scans (optional but ensures same context)
      - name: Build image locally for vuln scan
        run: task build-image

      # 8. Generate vulnerability attestations (source, iac, image)
      - name: Generate vulnerability attestations
        run: |
          mkdir -p attestations
          task exec -- trivy fs --format cosign-vuln src/ > attestations/vuln-source.json
          task exec -- trivy config --format cosign-vuln src/iac/ > attestations/vuln-iac.json
          task exec -- trivy image --format cosign-vuln supply-chain-app:latest > attestations/vuln-image.json

      # 9. Install Cosign (keyless)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # 10. Sign image with GitHub OIDC
      - name: Sign image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes "$IMAGE"

      # 11. Attach attestations: vuln-source, vuln-iac, vuln-image
      - name: Attach vulnerability attestations
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes --type vuln --predicate attestations/vuln-source.json "$IMAGE"
          cosign attest --yes --type vuln --predicate attestations/vuln-iac.json "$IMAGE"
          cosign attest --yes --type vuln --predicate attestations/vuln-image.json "$IMAGE"

      # 12. Verify image signature
      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            "$IMAGE" | jq

      # 13. Verify attestations: provenance, sbom, vuln (5 types)
      - name: Verify all 5 attestations
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for t in slsaprovenance spdxjson vuln; do
            echo "🔍 Verifying attestation: $t"
            cosign verify-attestation \
              --type "$t" \
              --certificate-identity-regexp=".*" \
              --certificate-oidc-issuer-regexp=".*" \
              "$IMAGE" | jq
          done

      # 14. Check Rekor entries (must be ≥6)
      - name: Check Rekor transparency log
        run: |
          HASH=$(echo "$DIGEST" | cut -d: -f2)
          echo "Looking up Rekor entries for: $HASH"
          rekor-cli search --sha "$HASH" | tee rekor.log
          COUNT=$(grep -E '^[a-f0-9]{64}$' rekor.log | wc -l)
          echo "Found Rekor entries: $COUNT"
          if [ "$COUNT" -lt 6 ]; then
            echo "❌ Not enough Rekor entries"
            exit 1
          fi
          echo "✅ Rekor OK"
