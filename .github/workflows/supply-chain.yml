name: supply-chain

on:
  push:
    branches: [ main ]

permissions:
  id-token: write      # Für keyless signing via GitHub OIDC
  contents: read
  packages: write      # Für GHCR Push

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io

    steps:
      # -------------------------
      # Phase 0: Setup
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/supply-chain-app" >> $GITHUB_ENV

      - name: Install Task
        run: |
          sudo snap install task --classic
          task --version

      - name: Build tools container image
        run: |
          docker build -t supply-chain-tools -f tools/Dockerfile .

      # -------------------------
      # Phase 1: Security Scans
      # -------------------------
      - name: Run all security scans
        run: |
          task scan-all

      # -------------------------
      # Phase 2: Attestation Generation
      # -------------------------
      - name: Set up Docker Buildx (attestation support)
        run: |
          docker buildx create --name container-builder --driver docker-container --use || true
          docker buildx inspect --bootstrap

      - name: Build image with attestation artifacts (provenance, sbom)
        run: |
          task build-image-with-attestation

      - name: Extract provenance and SBOM predicates
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mkdir -p attestations
          cat out/provenance.json | jq .predicate | tee attestations/provenance.json
          jq '.predicate' out/sbom.spdx.json > attestations/sbom.json

      - name: Validate provenance attestation
        run: task validate:provenance

      - name: Validate SBOM attestation
        run: task validate:sbom

      - name: Build application image (locally)
        run: task build-image

      - name: Generate vulnerability attestations
        run: |
          mkdir -p attestations
          task exec -- trivy fs --format cosign-vuln src/ > attestations/vuln-source.json
          task exec -- trivy config --format cosign-vuln src/iac/ > attestations/vuln-iac.json
          task exec -- trivy image --format cosign-vuln supply-chain-app:latest > attestations/vuln-image.json

      - name: List all generated attestations
        run: ls -lh attestations/

      - name: Validate all attestations
        run: task validate:all-attestations

      # -------------------------
      # Phase 3: Signing & Verification
      # -------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          provenance: mode=max
          sbom: true

      - name: Export image digest
        run: echo "IMAGE_DIGEST=${{ steps.build-and-push.outputs.digest }}" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
        run: |
          echo "Signing image: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

      - name: Verify signature exists in Rekor
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
        run: |
          echo "🔍 Checking for cosign signature in artifact list..."
          cosign tree --experimental-oci11 "${IMAGE_REF}" | grep -q "sign/v1" || {
            echo "❌ No cosign sign/v1 signature found."
            exit 1
          }
          echo "✅ Signature present."


      - name: Attach all 5 attestations
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
        run: |
          cosign attest --yes \
            --type https://slsa.dev/provenance/v0.2 \
            --predicate attestations/provenance.json \
            "${IMAGE_REF}"
      
          cosign attest --yes \
            --type https://spdx.dev/Document \
            --predicate attestations/sbom.json \
            "${IMAGE_REF}"
      
          cosign attest --yes \
            --type https://cosign.dev/attestation/vuln/source \
            --predicate attestations/vuln-source.json \
            "${IMAGE_REF}"
      
          cosign attest --yes \
            --type https://cosign.dev/attestation/vuln/iac \
            --predicate attestations/vuln-iac.json \
            "${IMAGE_REF}"
      
          cosign attest --yes \
            --type https://cosign.dev/attestation/vuln/image \
            --predicate attestations/vuln-image.json \
            "${IMAGE_REF}"

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
        run: |
          cosign verify --experimental-oci11 \
            --certificate-identity-regexp="https://github.com/.+" \
            --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"

      - name: Verify all attestations
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
        run: |
          for TYPE in \
            "https://slsa.dev/provenance/v0.2" \
            "https://spdx.dev/Document" \
            "https://cosign.dev/attestation/vuln/source" \
            "https://cosign.dev/attestation/vuln/iac" \
            "https://cosign.dev/attestation/vuln/image"
          do
            echo "Verifying $TYPE..."
            cosign verify-attestation --experimental-oci11 \
              --type "$TYPE" \
              --certificate-identity-regexp="https://github.com/.+" \
              --certificate-oidc-issuer-regexp="https://token.actions.githubusercontent.com" \
              "${IMAGE_REF}" > /dev/null
          done
          echo "✅ All 5 attestations verified."

      - name: Check Rekor log for 6 entries
        env:
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
        run: |
          HASH="${IMAGE_DIGEST#sha256:}"
          echo "🔍 Checking Rekor entries for SHA: $HASH"
      
          # Abfrage im JSON-Format (robuster als Textausgabe)
          task exec -- rekor-cli search --sha "$HASH" --format json > rekor-output.json
      
          # Ausgabe prüfen
          cat rekor-output.json | jq
      
          # Anzahl zählen
          ENTRY_COUNT=$(jq length rekor-output.json)
          echo "🧮 Found Rekor entries: $ENTRY_COUNT"
      
          if [ "$ENTRY_COUNT" -lt 6 ]; then
            echo "❌ Rekor entry count insufficient (need at least 6)"
            exit 1
          fi
      
          echo "✅ Rekor has at least 6 entries (1 signature + 5 attestations)."

