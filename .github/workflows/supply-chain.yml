name: supply-chain

on:
  push:
    branches: [ main ]

permissions:
  id-token: write      # Für keyless signing via GitHub OIDC
  contents: read
  packages: write      # Für GHCR Push

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io

    steps:
      # -------------------------
      # Phase 0: Setup
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/supply-chain-app" >> $GITHUB_ENV

      - name: Install Task
        run: |
          sudo snap install task --classic
          task --version

      - name: Build tools container image
        run: |
          docker build -t supply-chain-tools -f tools/Dockerfile .

      # -------------------------
      # Phase 1: Security Scans
      # -------------------------
      - name: Run all security scans
        run: |
          task scan-all

      # -------------------------
      # Phase 2: Attestation Generation
      # -------------------------
      - name: Set up Docker Buildx (attestation support)
        run: |
          docker buildx create --name container-builder --driver docker-container --use || true
          docker buildx inspect --bootstrap

      - name: Build image with attestation artifacts (provenance, sbom)
        run: |
          task build-image-with-attestation

      - name: Extract provenance and SBOM predicates
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mkdir -p attestations
          cat out/provenance.json | jq .predicate | tee attestations/provenance.json
          jq '.predicate' out/sbom.spdx.json > attestations/sbom.json

      - name: Validate provenance attestation
        run: task validate:provenance

      - name: Validate SBOM attestation
        run: task validate:sbom

      - name: Build application image (locally)
        run: task build-image

      - name: Generate vulnerability attestations
        run: |
          mkdir -p attestations
          task exec -- trivy fs --format cosign-vuln src/ > attestations/vuln-source.json
          task exec -- trivy config --format cosign-vuln src/iac/ > attestations/vuln-iac.json
          task exec -- trivy image --format cosign-vuln supply-chain-app:latest > attestations/vuln-image.json

      - name: List all generated attestations
        run: ls -lh attestations/

      - name: Validate all attestations
        run: task validate:all-attestations

          # -------------------------
      # Phase 3: Sign, Attest, Verify
      # -------------------------

      - name: Build and tag image for ttl.sh
        run: |
          IMAGE_NAME=ttl.sh/supply-chain-app-${{ github.run_id }}:3h
          docker build -t supply-chain-app:latest -f src/docker/Dockerfile src/
          docker tag supply-chain-app:latest $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push to ttl.sh and extract digest
        run: |
          docker push $IMAGE_NAME 2>&1 | tee push-output.txt
          DIGEST=$(grep "digest:" push-output.txt | awk '{print $3}')
          IMAGE_REF="${IMAGE_NAME%@*}@$DIGEST"
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE_REF" >> $GITHUB_ENV
          echo "Pushed image: $IMAGE_REF"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "Signing image: $IMAGE"
          cosign sign --yes "$IMAGE"

      - name: Attach attestations (provenance, sbom, vuln)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes --type slsaprovenance --predicate attestations/provenance.json "$IMAGE"
          cosign attest --yes --type spdxjson        --predicate attestations/sbom.json "$IMAGE"
          cosign attest --yes --type vuln            --predicate attestations/vuln-source.json "$IMAGE"
          cosign attest --yes --type vuln            --predicate attestations/vuln-iac.json "$IMAGE"
          cosign attest --yes --type vuln            --predicate attestations/vuln-image.json "$IMAGE"

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            "$IMAGE" | jq

      - name: Verify all attestations
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for t in slsaprovenance spdxjson vuln; do
            echo "Verifying attestation: $t"
            cosign verify-attestation \
              --type "$t" \
              --certificate-identity-regexp=".*" \
              --certificate-oidc-issuer-regexp=".*" \
              "$IMAGE" | jq
          done

      - name: Check Rekor transparency log
        run: |
          HASH=$(echo "$DIGEST" | cut -d: -f2)
          echo "Checking Rekor for hash: $HASH"
          rekor-cli search --sha "$HASH" | tee rekor-output.txt
          ENTRY_COUNT=$(grep -E '^[a-f0-9]{64}$' rekor-output.txt | wc -l)
          echo "Found $ENTRY_COUNT Rekor entries"
          if [ "$ENTRY_COUNT" -lt 6 ]; then
            echo "❌ Not enough Rekor entries (expected: 6)"
            exit 1
          fi
          echo "✅ Rekor entries valid (>= 6)"

